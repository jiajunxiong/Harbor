[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor"
version = "0.1.0"
description = "Hong Kong and U.S. equity research and paper-trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"pydantic>=2.8,<3",
	"pydantic-settings>=2.3,<3",
]

[project.scripts]
harbor-cli = "harbor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]