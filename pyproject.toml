[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor"
version = "0.1.0"
description = "Hong Kong and U.S. equity research and paper-trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"alembic>=1.13,<2",
	"numpy>=2.4.6,<3",
	"packaging>=24,<27",
	"pandas>=3.0.3,<4",
	"pydantic>=2.8,<3",
	"pydantic-settings>=2.3,<3",
	"psycopg[binary]>=3.2,<4",
	"SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
backtest = [
	"numba>=0.66,<0.67",
	"vectorbt>=1.1.0,<2",
]
dev = [
	"mypy>=1.11,<2",
	"pytest>=8.0,<9",
	"ruff>=0.6,<1",
]

[project.scripts]
harbor-cli = "harbor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true