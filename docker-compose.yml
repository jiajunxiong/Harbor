services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harbor}
      POSTGRES_USER: ${POSTGRES_USER:-harbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harbor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" || { echo "PostgreSQL health check failed." >&2; exit 1; }',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: